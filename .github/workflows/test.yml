name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    name: selftest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 量测用例不需要任何第三方包，但"画图不能崩"那部分需要 Pillow。
      # 装上它是为了让画图路径**真的被覆盖**；即使 pip 挂了，
      # selftest 也会把这部分标成"跳过"而不是假装通过（see SKIPPED）。
      - name: 装 Pillow（只为了覆盖画图路径）
        run: pip install --quiet Pillow
        continue-on-error: true

      - name: PCB footprint check — selftest
        run: python skills/kicad-check-pcb-component/scripts/selftest.py

      - name: Schematic symbol check — selftest
        run: python skills/kicad-check-sch-component/scripts/selftest.py

      - name: Library part generator — selftest
        run: python skills/kicad-create-lib-part/scripts/selftest.py

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyflakes
      # 未用导入 / 未定义名 / 重定义。历史上抓到过"两个同名函数互相覆盖"。
      - name: pyflakes
        run: python -m pyflakes $(git ls-files '*.py')

  skill-frontmatter:
    name: skill frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Agent Skills 标准要求 name 只能是小写+数字+连字符，且和目录名一致。
      # pi 自己宽容，但别的 harness 不宽容 —— 这里卡住。
      - name: validate SKILL.md
        run: |
          pip install --quiet pyyaml
          python - <<'PY'
          import pathlib, re, sys
          import yaml
          bad = 0
          for d in sorted(pathlib.Path("skills").iterdir()):
              f = d / "SKILL.md"
              if not f.exists():
                  continue
              t = f.read_text(encoding="utf-8")
              if not t.startswith("---"):
                  print("::error::%s 没有 frontmatter" % f); bad += 1; continue
              fm = t.split("---")[1]
              m = re.search(r"^name:\s*(\S+)", fm, re.M)
              de = re.search(r"^description:\s*(.+)$", fm, re.M)
              if not m:
                  print("::error::%s 缺 name" % f); bad += 1; continue
              name = m.group(1)
              if not re.fullmatch(r"[a-z0-9]+(-[a-z0-9]+)*", name):
                  print("::error::%s name 不合法: %r" % (f, name)); bad += 1
              if name != d.name:
                  print("::error::%s name(%s) != 目录名(%s)" % (f, name, d.name)); bad += 1
              if not de:
                  print("::error::%s 缺 description" % f); bad += 1
              elif len(de.group(1)) > 1024:
                  print("::error::%s description 超过 1024 字符" % f); bad += 1
              # 正则只能查长度和形状。description 里一个裸 ": " 就会让 YAML
              # 解析失败（别的 harness 真要按 YAML 读），而这里一条都看不到。
              # 实测中过：把 "datasheet: house-style lint" 写进 description。
              try:
                  y = yaml.safe_load(fm)
                  if not isinstance(y, dict) or "description" not in y:
                      raise ValueError("frontmatter 不是含 description 的映射")
              except Exception as e:
                  print("::error::%s frontmatter 不是合法 YAML: %s" % (f, e)); bad += 1
              print("ok   %s (%s)" % (d.name, name))
          sys.exit(1 if bad else 0)
          PY

  # 端到端回归：spec -> 生成 -> 两个校验 -> NG 必须为 0。
  # 它同时是唯一会真跑 3D 贴合（fit3d）与 DRC 的地方 —— 别处全是 skip。
  # GitHub runner 上没有 KiCad，所以这一步会**大声跳过**（退出码 0）。
  # 本机装了 KiCad 才有意义；跑法：python e2e.py
  e2e:
    name: e2e (needs KiCad, skips without)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: e2e
        run: python e2e.py
